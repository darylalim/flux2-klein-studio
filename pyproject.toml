[project]
name = "flux2-klein-studio"
version = "0.7.0"
description = "Streamlit application for generating and editing images using Black Forest Labs FLUX.2 Klein on Apple Silicon with MLX."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mflux",
    "mlx-vlm",
    "pillow",
    "streamlit",
]

[project.urls]
Homepage = "https://github.com/darylalim/flux2-klein-studio"
Repository = "https://github.com/darylalim/flux2-klein-studio"
Changelog = "https://github.com/darylalim/flux2-klein-studio/releases"

# Pin the uv that writes and validates uv.lock. Without this, CI's
# astral-sh/setup-uv installs whatever uv is latest, and a uv whose marker
# normalization differs from the one that wrote the lock makes `uv sync
# --locked` fail on a lockfile nobody touched. setup-uv reads this key when its
# `version:` input is empty, so this is the single source of truth for both
# local and CI. Must be an `==` pin: setup-uv strips `==` but cannot parse a
# PEP 440 comma range, and would silently fall back to latest. Bump this and
# re-run `uv lock` together.
[tool.uv]
required-version = "==0.12.5"

[dependency-groups]
dev = [
    "pytest",
    "pyyaml>=6.0.3",
    # >=0.16 is where `ruff format` started formatting Python fenced in
    # Markdown. CI's `ruff format --check .` and .claude/hooks/ruff-format.sh
    # both depend on that, so an older ruff would silently reopen the
    # local/CI divergence the hook exists to close.
    "ruff>=0.16",
    "ty",
]

[tool.pytest.ini_options]
# The smoke tests load real weights (~8.6GB) and generate for real, so they are
# opt-in: plain `uv run pytest` deselects them (which is what CI runs -- it has
# neither the weights nor Apple Silicon), `uv run pytest -m smoke` runs them.
# They are the only tests that touch the real mflux/mlx-vlm surface, so treat
# them as a manual pre-release gate rather than dead weight.
markers = [
    "smoke: real model load and generation; needs weights on disk, opt-in",
]
addopts = "-m 'not smoke'"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]  # line length is enforced by the formatter
