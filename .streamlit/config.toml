# No [theme] section on purpose. With no custom theme declared, the app renders
# Streamlit's stock light and dark themes and the in-app appearance switcher
# picks between them.
#
# Any [theme] key added back here makes this a *custom* theme, and a custom
# theme without both [theme.light] and [theme.dark] locks the app to a single
# mode -- so even a lone `font` would silently cost the light/dark switch. Set
# colors here rather than via CSS if a custom theme is ever wanted again, and
# define both variants. Locked by TestThemeConfig.
