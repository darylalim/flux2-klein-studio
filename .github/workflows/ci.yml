name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push on the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this job only reads public source and runs lint/type/test,
# never writing to the repo, so drop GITHUB_TOKEN to read-only.
permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check & test (macOS / Apple Silicon)
    # macos-14+ is arm64 (Apple Silicon), the app's target platform. Linux
    # runners can't be used: mlx only ships a CUDA build for Linux, so
    # `import mlx` fails on a GPU-less runner and the suite won't load.
    # macOS runners are free for public repositories.
    runs-on: macos-latest
    # A hang (e.g. a stalled `uv sync`) fails fast instead of holding a runner
    # for GitHub's 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        # No `version:` on purpose. setup-uv reads pyproject's
        # [tool.uv] required-version when this input is empty, so the uv version
        # has one source of truth shared with local development. Hardcoding it
        # here would shadow that pin and let the two drift.
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true # caches the uv cache dir, keyed on uv.lock

      - name: Install dependencies
        # --locked fails the build if uv.lock is stale (e.g. a version bump or
        # dependency change that forgot `uv lock`), instead of silently
        # re-resolving. Keeps the committed lockfile honest.
        run: uv sync --locked

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check .

      - name: Tests
        run: uv run pytest
